<header><a href="./learn/slides/4">← ONYX / LEARNING ARCHIVE</a><span class="eyebrow">MISSION BRIEFING</span></header><main><h1>A STORY WORTH TELLING.</h1>
<p class="notice">Storyboard ที่จัดทำในโปรเจกต์ สำหรับตรวจเนื้อหาก่อนสร้างสไลด์ใน NotebookLM — ไม่ใช่ผลลัพธ์จาก NotebookLM</p>
<section class="slide" aria-live="polite"><span class="eyebrow" id="label"></span><h2 id="title"></h2><p id="copy"></p></section>
<div class="actions"><button id="prev">← ก่อนหน้า</button><span class="slide-count" id="count"></span><button id="next">ถัดไป →</button><a class="button" href="downloads/notebooklm-source.md" download>ดาวน์โหลด source</a><a class="button" href="https://notebooklm.google.com/" target="_blank" rel="noopener">เปิด NotebookLM ↗</a></div>
<p class="muted">ใช้ปุ่มลูกศรบนคีย์บอร์ดเพื่อเปลี่ยนหน้า</p><footer>LOCAL STORYBOARD / EXTERNAL GENERATION PENDING</footer></main>
<script>
const slides=[['MEET ONYX–01.','หุ่นยนต์แปลงร่างต้นแบบสำหรับโครงงานการเรียนรู้ ไม่มีสินค้าหรือหุ่นยนต์จริง'],['SCULPTED IN BLACK.','เกราะดำซ้อนชั้น ดวงตาขาวอมฟ้า และภาพอ้างอิงตัวเดียวเพื่อรักษาเอกลักษณ์'],['ENERGY HAS LIMITS.','แบบจำลอง E=2400 Wh และ P(v)=200+0.5v² W: ที่ 20 km/h ใช้กำลังไฟ 400 W และทำงานได้ 6 ชั่วโมง'],['SENSE. DECIDE. MOVE.','อ่านเซนเซอร์ ตรวจแบตเตอรี่และสิ่งกีดขวางก่อนเคลื่อนไหว แล้วรับข้อมูลกลับมาอีกครั้ง'],['BETTER PROMPTS.','จาก zero-shot สู่ few-shot: เพิ่มตัวอย่าง ข้อกำหนด และเกณฑ์ตรวจผลลัพธ์'],['A CONCEPT. A BEGINNING.','สเปกสมมติ ภาพ AI และแบบจำลองที่ยังไม่รวมสภาพแวดล้อมจริง คือขอบเขตของโครงงานนี้']];let i=0;
function render(){document.querySelector('#label').textContent=`ONYX / STORYBOARD 0${i+1}`;document.querySelector('#title').textContent=slides[i][0];document.querySelector('#copy').textContent=slides[i][1];document.querySelector('#count').textContent=`${i+1} / 6`;document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===5;}
function move(d){i=Math.max(0,Math.min(5,i+d));render()};document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();
</script></body></html>
