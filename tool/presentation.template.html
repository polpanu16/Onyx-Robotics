<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONYX-01 / สไลด์นำเสนอโครงงาน</title>
<style>
@font-face{font-family:OnyxThai;src:url(data:font/ttf;base64,__ONYX_FONT__) format('truetype');font-weight:100 900;font-display:block}
:root{color-scheme:dark;--ink:#08090b;--paper:#ecedea;--muted:#9ea9b4;--ice:#b5dcf0;--edge:#29323d}
*{box-sizing:border-box}body{margin:0;background:#050608;color:var(--paper);font-family:Arial,OnyxThai,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}button,a{font:inherit}button{cursor:pointer}a{color:var(--ice)}
.toolbar{height:68px;display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--edge);position:sticky;top:0;background:var(--ink);z-index:10;font-size:12px;flex-wrap:wrap}.toolbar .brand{letter-spacing:5px;font-size:18px;color:var(--paper);text-decoration:none}.toolbar .spacer{flex:1}.toolbar button,.toolbar .download{padding:10px 16px;background:#151b22;color:var(--paper);border:1px solid var(--edge);text-decoration:none}.toolbar button:disabled{opacity:.35}.toolbar select{padding:9px;background:var(--ink);color:var(--paper);border:1px solid var(--edge);max-width:220px}
.viewer{padding:32px 12px;display:flex;justify-content:center;overflow:hidden}.slide-frame{position:relative}.slide{width:1280px;height:720px;background:var(--ink);position:relative;padding:40px 52px;break-after:page;overflow:visible;display:none}.slide.active{display:block}.slide::before{content:'';position:absolute;right:0;top:0;width:450px;height:500px;background:radial-gradient(ellipse at 100% 0, #162733 0,transparent 70%);pointer-events:none}.topline{display:flex;align-items:center;justify-content:space-between;position:relative;color:var(--ice);font-size:11px;letter-spacing:2px}.topline .mark{width:12px;height:12px;border:2px solid var(--ice);display:inline-block;transform:rotate(45deg);margin-right:12px}.topline .issue{color:#718291;font-size:10px}h1{font-size:36px;line-height:1.35;font-weight:600;letter-spacing:-.7px;margin:20px 0 4px;position:relative}.subtitle{font-size:13px;color:var(--muted);margin-bottom:24px;letter-spacing:.3px}.body{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:30px;height:465px;position:relative}.main{min-width:0}.side{border-left:1px solid var(--edge);padding-left:24px;display:flex;flex-direction:column;gap:18px;min-width:0}.text{font-family:Arial,OnyxThai,sans-serif;font-size:17px;line-height:1.9;white-space:pre-wrap;margin:0 0 17px;overflow-wrap:anywhere}.text.small{font-size:14px;line-height:1.8}.prompt{white-space:pre-wrap;font:15px/1.7 Arial,OnyxThai,sans-serif;padding:20px;border:1px solid #334350;background:#101820;margin:0;overflow-wrap:anywhere}.prompt.compact{font-size:13px;line-height:1.7;padding:16px}.kicker{font-size:9px;letter-spacing:2px;color:var(--ice);margin:0 0 10px}.note{font-size:13px;line-height:1.85;color:var(--muted);white-space:pre-wrap}.stamp{padding:14px;border:1px solid var(--edge);font-size:11px;line-height:1.85;color:var(--muted)}.number{font-size:86px;font-weight:200;line-height:1;color:#283a47;letter-spacing:-5px}.footer{position:absolute;bottom:27px;left:52px;right:52px;display:flex;justify-content:space-between;border-top:1px solid var(--edge);padding-top:13px;font-size:9px;color:#8a98a6;letter-spacing:1.4px}.footer a{color:var(--ice);text-decoration:none}.robot{width:100%;height:260px;object-fit:contain;background:#060708;border:1px solid var(--edge)}.image-layout{grid-template-columns:390px minmax(0,1fr)}.image-layout .robot{height:440px;object-fit:contain;border:0}.image-layout .side{border:0;padding:0}.diagram{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--paper)}.node{padding:10px 18px;border:1px solid #536c7a;background:#14212a;text-align:center;min-width:180px}.arrow{color:var(--ice);font-size:14px;line-height:1.1}.branches{display:flex;gap:14px;justify-content:center;align-items:start}.branches .node{min-width:0;max-width:180px;font-size:11px}.branch-label{font-size:9px;line-height:1.5;color:var(--ice);text-align:center;margin-bottom:5px}.code{font:15px/1.9 monospace;padding:20px;background:#121a21;white-space:pre-wrap;border:1px solid var(--edge)}.equation{font:25px/1.8 Georgia,serif;padding:18px;background:#121a21;color:var(--ice)}table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}td,th{padding:11px;border-bottom:1px solid var(--edge);text-align:left}th{font-size:10px;color:var(--ice);letter-spacing:1px}.status{border-left:2px solid var(--ice);padding:18px;background:#15202a;font-size:16px;line-height:1.8}.flow-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:20px 0}.flow-inline span{font-size:12px;padding:9px 12px;border:1px solid var(--edge)}.document{background:#e8e8e3;color:#151b22;padding:22px;font-family:Georgia,serif}.document h3{margin:0 0 8px;font-size:24px}.document p{font-size:13px;line-height:1.65}.document small{font-family:Arial,sans-serif;font-size:8px;letter-spacing:1.3px}.body.fewshot{grid-template-columns:minmax(0,1fr) 300px}.fewshot .side .note{font-size:12px;line-height:1.9}.screen-hint{text-align:center;font-size:11px;color:var(--muted);padding:0 20px 25px}.thumbs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1100px;margin:0 auto 28px;padding:0 18px}.thumbs button{padding:8px 12px;background:#111820;border:1px solid var(--edge);color:var(--muted);font-size:11px}.thumbs button[aria-current=true]{color:var(--ice);border-color:var(--ice)}
@media(max-width:700px){.toolbar{height:auto;min-height:100px;gap:8px;padding:12px}.toolbar .brand{font-size:14px}.toolbar select{max-width:160px}.toolbar button,.toolbar .download{font-size:10px;padding:8px}.viewer{padding-top:16px}}
@page{size:1280px 720px;margin:0}
@media print{.toolbar,.screen-hint,.thumbs{display:none!important}.viewer{display:block;padding:0;overflow:visible}.slide-frame{width:1280px!important;height:auto!important;transform:none!important}.slide{display:block!important;transform:none!important;margin:0;box-shadow:none;break-inside:avoid}.slide:last-child{break-after:auto}html,body{width:1280px;margin:0;background:var(--ink)}}
.text,.note,.prompt{word-break:normal;overflow-wrap:break-word}.text{font-size:18px;line-height:1.9}.text.small{font-size:16px}.prompt{font-size:17px;line-height:1.85}.prompt.compact{font-size:15px;line-height:1.8}.fewshot .side .note{font-size:13px}.note{font-size:14px}.cover{padding:58px;background:#08090b}.cover h1{font:800 92px/1 Arial,sans-serif;margin:100px 0 24px;letter-spacing:-4px}.cover .strap{font-size:28px;line-height:1.6;max-width:570px}.cover .cover-note{margin-top:38px;font-size:14px;line-height:1.9;color:var(--muted);max-width:540px}.toc{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}.toc-item{border:1px solid var(--edge);padding:22px;display:flex;align-items:center;gap:20px}.toc-item b{font-size:32px;color:var(--ice);font-weight:300}.toc-item p{margin:0;font-size:18px;line-height:1.6}.toc-item small{font-size:11px;color:var(--muted)}.source-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.source-box{padding:20px;border:1px solid var(--edge);font-size:14px;line-height:1.85}.source-box b{font-size:17px;color:var(--ice)}.source-box a{font-size:12px;word-break:break-all}.check-list{margin:30px 0;padding:0;list-style:none}.check-list li{padding:18px 20px;border-bottom:1px solid var(--edge);font-size:19px;line-height:1.7}.check-list li::before{content:'□';color:var(--ice);margin-right:20px}.zero-quote{font-size:54px;line-height:1.5;color:var(--ice);padding:42px 0}.issue{white-space:nowrap}.mermaid-output{display:block;width:100%;height:292px;object-fit:contain;background:#fff;border:1px solid var(--edge)}
.cover h1{margin-top:58px;font-size:84px}.cover .cover-note{margin-top:22px;margin-bottom:0}.submission{position:relative;display:grid;grid-template-columns:270px 310px;gap:24px;margin-top:24px;padding-top:18px;border-top:1px solid var(--edge);width:604px}.submission small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.submission strong{display:block;font-size:20px;font-weight:500;line-height:1.7}.submission span{display:block;font-size:13px;color:var(--ice);line-height:1.9}.submission .student-id{color:var(--muted);font-size:12px}.example-card{margin-bottom:15px;border:1px solid var(--edge);background:#0c1015}.example-card img{display:block;width:100%;height:116px;object-fit:cover}.example-card div{padding:10px 12px}.example-card b{display:block;color:var(--ice);font-size:11px;line-height:1.5}.example-card small{display:block;color:var(--muted);font-size:9px;line-height:1.5;margin-top:3px}
</style></head><body>
<header class="toolbar"><a class="brand" href="./#/presentation">ONYX</a><select id="chapter" aria-label="เลือกหัวข้อ"><option value="0">ปกและสารบัญ</option><option value="2">01 / ภาพ AI</option><option value="7">02 / Desmos</option><option value="12">03 / Mermaid</option><option value="17">04 / LaTeX</option><option value="22">05 / NotebookLM</option><option value="27">06 / GitHub</option><option value="32">แหล่งข้อมูลและการส่งงาน</option></select><span class="spacer"></span><button id="prev" aria-label="หน้าก่อนหน้า">←</button><span id="count" aria-live="polite"></span><button id="next" aria-label="หน้าถัดไป">→</button><a class="download" href="downloads/pdfs/onyx-complete.pdf" download>PDF ฉบับเต็ม ↓</a><button id="fullscreen">เต็มจอ</button></header>
<main class="viewer"><div class="slide-frame" id="deck"></div></main><p class="screen-hint">ใช้ปุ่ม ← → เพื่อเปลี่ยนหน้า</p><nav class="thumbs" id="thumbs" aria-label="เลือกหน้าสไลด์"></nav>
<script>
const data=__ONYX_DATA__;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const block=(s,cls='text')=>`<p class="${cls}">${esc(s)}</p>`;
const prompt=(s,compact=false)=>`<p class="kicker">PROMPT / INPUT</p><pre class="prompt ${compact?'compact':''}">${esc(s)}</pre>`;
function graph(refined){let d='';for(let v=0;v<=60;v++){let t=refined?2400/(200+.5*v*v):12-.15*v;d+=`${v?'L':'M'} ${45+v*8.6} ${245-t*17}`;}return `<svg viewBox="0 0 610 290" width="100%" style="max-height:255px;background:#0b1117" role="img" aria-label="Speed versus runtime">${[0,3,6,9,12].map(t=>`<line x1="45" y1="${245-t*17}" x2="570" y2="${245-t*17}" stroke="#29323d"/><text x="14" y="${249-t*17}" fill="#9ea9b4" font-size="12">${t}</text>`).join('')}<path d="${d}" fill="none" stroke="#b5dcf0" stroke-width="3"/>${[0,20,40,60].map(v=>`<text x="${39+v*8.6}" y="266" fill="#9ea9b4" font-size="12">${v}</text>`).join('')}<text x="14" y="20" fill="#b5dcf0" font-size="12">h</text><text x="554" y="284" fill="#b5dcf0" font-size="12">km/h</text></svg>`}
function result(l,refined){
 if(l.id==='visual')return '';
 if(l.id==='math'){const url=refined?'https://www.desmos.com/calculator/j8audru9dr':'https://www.desmos.com/calculator/jnfjyibmge';return graph(refined)+`<div class="equation">${refined?'t(v) = 2400 / (200 + 0.5v²)':'t(v) = 12 − 0.15v'}</div><p class="note">ผลงานจริง: <a href="${url}">${refined?'กราฟรอบปรับปรุง':'กราฟ Zero-shot'} ใน Desmos</a></p>`;}
 if(l.id==='systems')return `<img class="mermaid-output" src="${data.images[refined?'mermaidRefined':'mermaidZero']}" alt="${refined?'Refined':'Zero-shot'} Mermaid output">`;
 if(l.id==='document')return `<div style="display:flex;gap:18px;height:310px;justify-content:center">${(refined?['overleafFew1','overleafFew2']:['overleafZero']).map(key=>`<img src="${data.images[key]}" style="height:100%;max-width:48%;object-fit:contain" alt="PDF from Overleaf">`).join('')}</div><p class="note" style="margin-top:10px">PDF จาก Overleaf · ${refined?'onyx_few.pdf · 2 หน้า':'onyx_zero.pdf · 1 หน้า'}</p>`;
 if(l.id==='slides')return `<img src="${data.images[refined?'notebookRefined':'notebookZero']}" alt="${refined?'NotebookLM output':'Simulated Zero-shot'}" style="width:100%;height:280px;object-fit:contain"><p class="note"><a href="https://polpanu16.github.io/Onyx-Robotics/downloads/${refined?'ONYX-01_Digital_Simulation.pdf':'notebooklm-zero-simulated.pdf'}">${refined?'เปิด PDF จาก NotebookLM · 10 หน้า':'เปิด PDF จำลอง Zero-shot · 3 หน้า'}</a></p>`;
 if(l.id==='github')return refined?`<div style="height:240px;background:linear-gradient(90deg,#08090b,#08090b20),url('${data.images.hero}') center/cover;padding:28px;border:1px solid var(--edge)"><b style="font-size:30px">ONYX-01</b><p>6 หัวข้อ · 30 หน้า · ภาพ กราฟ และเอกสาร</p></div><p class="note"><a href="https://polpanu16.github.io/Onyx-Robotics/">เปิดเว็บไซต์ ONYX-01</a> · <a href="https://github.com/polpanu16/Onyx-Robotics">GitHub repository</a></p>`:`<div class="code">ONYX-01\nหุ่นยนต์แปลงร่างเกราะดำ\n\nชื่อรุ่น · คำแนะนำ · ตารางข้อมูลพื้นฐาน\nเว็บไซต์ต้นแบบหน้าเดียว</div><p class="note"><a href="https://polpanu16.github.io/Onyx-Robotics/first-website.html">เปิดเว็บไซต์รอบแรก</a></p>`;
 return '';
}
function side(l,i,step){return `<div class="number">0${i+1}</div><div><p class="kicker">KEYWORDS</p><div class="note">${esc(l.keyword)}</div></div><div><p class="kicker">PROCESS</p><div class="note">${data.steps.map((s,k)=>`${k===step?'●':'○'} 0${k+1} ${esc(s)}`).join('<br>')}</div></div><div class="stamp">EDUCATIONAL CONCEPT<br>สเปกสมมติ · ภาพสร้างด้วย AI<br>ข้อมูลหลัก: ONYX–01 ตัวเดียว</div>`}
const deck=$('#deck');
function addSpecial(title,subtitle,body,classes=''){const s=document.createElement('article');s.className='slide '+classes;s.innerHTML='<div class="topline"><span><i class="mark"></i>ONYX-01 / LEARNING PORTFOLIO</span><span class="issue">ฉบับปรับปรุงภาษาไทย · กันยายน 2026</span></div><h1>'+title+'</h1><div class="subtitle">'+subtitle+'</div>'+body+'<div class="footer"><span>ONYX-01 / หุ่นยนต์หนึ่งตัว เรียนรู้หกด้าน</span><span class="document-page"></span></div>';deck.append(s);return s;}
const cover=addSpecial('ONYX-01','PROMPT ENGINEERING / FROM A BLACK ROBOT TO A DISTINCT IDENTITY','<div class="strap">จากคำว่า “หุ่นยนต์สีดำ”<br>สู่หุ่นยนต์ต้นแบบที่มีเอกลักษณ์</div><p class="cover-note">บันทึกการใช้ AI ใน 6 หัวข้อ · เนื้อหาหลัก 30 หน้า<br>โครงงานเพื่อการศึกษา ไม่แสวงหาผลกำไร</p><div class="submission"><div><small>จัดทำโดย</small><strong>'+esc(data.submission.thaiName)+'</strong><span>'+esc(data.submission.englishName)+'</span><span class="student-id">รหัสนักศึกษา '+esc(data.submission.studentId)+'</span></div><div><small>เสนอ</small><strong>'+esc(data.submission.instructorThai)+'</strong><span>'+esc(data.submission.instructor)+'</span></div></div>','cover');
cover.style.backgroundImage="linear-gradient(90deg,#08090b 25%,#08090b15 75%),url('"+data.images.hero+"')";cover.style.backgroundSize='cover';cover.style.backgroundPosition='center';
addSpecial('สารบัญ','เลือกอ่านตามหัวข้อ เนื้อหาหลักหัวข้อละ 5 หน้า','<div class="toc">'+data.lessons.map((l,i)=>'<div class="toc-item"><b>0'+(i+1)+'</b><div><p>'+esc(l.title)+'</p><small>'+esc(l.english)+' · หน้าเนื้อหา '+(i*5+1)+'-'+(i*5+5)+'</small></div></div>').join('')+'</div><p class="note" style="margin-top:24px">แต่ละหัวข้อ: คำสั่งเริ่มต้น → ผลลัพธ์ครั้งแรก → ปรับคำสั่งด้วยตัวอย่าง → ผลลัพธ์หลังปรับปรุง → สิ่งที่ได้เรียนรู้</p>');

data.lessons.forEach((l,i)=>{for(let step=0;step<5;step++){
 let main='',sidebar=side(l,i,step),bodyClass='body';
 if(step===0)main=block(l.principle)+(l.id==='visual'?`<p class="kicker">คำสั่งที่ส่งให้ AI จริง</p><div class="zero-quote">“หุ่นยนต์สีดำ”</div><p class="note">ไม่มีชื่อรุ่น ไม่มีภาพอ้างอิง และไม่เพิ่มรายละเอียดอื่น</p>`:prompt(l.firstPrompt));
 if(step===1||step===3){const refined=step===3;main=block(refined?l.newResult:l.firstResult,'text small')+result(l,refined);if(l.id==='visual'){bodyClass+=' image-layout';sidebar=`<img class="robot" src="${data.images[refined?'refined':'zero']}" alt="ONYX-01 actual AI generated output">`;main+=`<div class="stamp">${refined?'REFINED / REFERENCE-GUIDED IMAGE':'ZERO-SHOT / FIRST GENERATED IMAGE'}<br>หลักฐานภาพจริง เก็บต้นฉบับไว้ทั้งสองรอบ</div>`;}}
 if(step===2){bodyClass+=' fewshot';main=prompt(l.newPrompt,true);sidebar=l.id==='visual'?`<p class="kicker">VISUAL EXAMPLES</p><div class="example-card"><img src="${data.images.exampleWatch}" alt="Black watch example"><div><b>ตัวอย่างที่ 1 / นาฬิกาสีดำ</b><small>พื้นผิวดำด้าน · แสงขอบสีเงิน</small></div></div><div class="example-card"><img src="${data.images.exampleCar}" alt="Black sports car example"><div><b>ตัวอย่างที่ 2 / รถสปอร์ตสีดำ</b><small>มุมกล้องต่ำ · โลหะ · แสงฟ้าอ่อน</small></div></div><div class="stamp">FEW-SHOT = TASK + EXAMPLES</div>`:`<p class="kicker">REFINEMENT NOTES</p><div class="note">${esc(l.conversation)}</div><div class="stamp">FEW-SHOT = TASK + EXAMPLES<br>การเพิ่มรายละเอียดอย่างเดียวไม่ใช่ few-shot</div>`;}
 if(step===4){main=block(l.reflection);sidebar=`<p class="kicker">EVALUATION LENS</p><div class="note">01 ความตรงตามโจทย์<br>02 ความสอดคล้องของข้อมูล<br>03 ความเหมาะสมต่อการใช้งาน<br>04 ข้อจำกัดที่ยังเหลือ</div>`;}
 const n=i*5+step+1;
 const slide=document.createElement('article');slide.className='slide';slide.setAttribute('aria-label',`หน้า ${n}: ${l.title} / ${data.steps[step]}`);
 slide.innerHTML=`<div class="topline"><span><i class="mark"></i>ONYX / ${esc(l.english)}</span><span class="issue">PROMPT ENGINEERING · 2026</span></div><h1>${esc(data.steps[step])}</h1><div class="subtitle">0${i+1} / ${esc(l.title)} · ${data.labels[step]}</div><div class="${bodyClass}"><div class="main">${main}</div><aside class="side">${sidebar}</aside></div><div class="footer"><span>ONYX–01 / ONE PROTOTYPE. SIX PERSPECTIVES.</span><span>เนื้อหา ${String(n).padStart(2,'0')} / 30 · เอกสาร ${n+2} / 33</span></div>`;
 deck.append(slide);
}});

let current=Math.max(0,Math.min(32,Number(new URLSearchParams(location.search).get('page')||1)-1));
const slides=[...document.querySelectorAll('.slide')];
document.querySelectorAll('.document-page').forEach(e=>e.textContent='เอกสาร '+(slides.indexOf(e.closest('.slide'))+1)+' / '+slides.length);
slides.forEach((_,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.onclick=()=>show(i);$('#thumbs').append(b)});
function show(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,n)=>s.classList.toggle('active',n===current));$('#count').textContent=(current+1)+' / '+slides.length;$('#prev').disabled=current===0;$('#next').disabled=current===slides.length-1;$('#chapter').value=String(current<2?0:current>=32?32:2+Math.floor((current-2)/5)*5);[...$('#thumbs').children].forEach((b,n)=>b.setAttribute('aria-current',n===current));}
function resize(){const scale=Math.min(1,(window.innerWidth-24)/1280);deck.style.width=`${1280*scale}px`;deck.style.height=`${720*scale}px`;slides.forEach(s=>{s.style.transformOrigin='top left';s.style.transform=`scale(${scale})`})}
$('#prev').onclick=()=>show(current-1);$('#next').onclick=()=>show(current+1);$('#chapter').onchange=e=>show(Number(e.target.value));
$('#fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){$('#fullscreen').textContent='ใช้โหมดเต็มจอของเบราว์เซอร์'}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
window.addEventListener('resize',resize);show(current);resize();
document.fonts.ready.then(()=>{document.documentElement.dataset.presentationReady='true'});
if(new URLSearchParams(location.search).has('pdf'))location.replace('downloads/pdfs/onyx-complete.pdf');
