  <style>
    body{margin:0;background:#08090b}
    #loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;color:#ecedea;font-family:Arial,sans-serif;background:radial-gradient(ellipse at center,#101f2c 0,transparent 58%)}
    #loading strong{font-size:34px;letter-spacing:12px;text-shadow:0 0 30px #81d8ff40}
    #loading p{font-size:9px;letter-spacing:3px;color:#959ba6;margin-top:22px}
    .boot-mark{width:34px;height:34px;border:1px solid #81d8ff;margin:0 auto 38px;transform:rotate(45deg);box-shadow:0 0 24px #81d8ff44,inset 0 0 18px #81d8ff22;animation:boot-pulse 3s ease-in-out infinite}
    .boot-track{height:1px;background:#253440;margin-top:18px;overflow:hidden}
    .boot-track::after{content:'';display:block;height:1px;width:40%;background:linear-gradient(90deg,transparent,#81d8ff,transparent);animation:boot-scan 2.8s ease-in-out infinite}
    @keyframes boot-pulse{50%{opacity:.35;box-shadow:0 0 6px #81d8ff22}}
    @keyframes boot-scan{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
    @media(prefers-reduced-motion:reduce){.boot-mark,.boot-track::after{animation:none}}
  </style>
  <div id="loading" role="status" aria-label="กำลังโหลดเว็บไซต์ ONYX"><span class="boot-mark" aria-hidden="true"></span><strong>ONYX</strong><p>INITIALIZING THE FUTURE</p><span class="boot-track" aria-hidden="true"></span></div>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());</script>
